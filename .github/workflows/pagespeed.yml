name: Lighthouse Mobile Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pagespeed.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production edge
        run: sleep 25

      - name: Run Lighthouse mobile
        env:
          TARGET_URL: https://constancia-nu.vercel.app/
        run: |
          google-chrome --version || chromium --version || true
          npx --yes lighthouse@12.8.2 "$TARGET_URL"             --output=json             --output-path=lighthouse.json             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --quiet

      - name: Print audit summary
        run: |
          node <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("lighthouse.json","utf8"));
          const categories=Object.fromEntries(Object.entries(j.categories).map(([k,v])=>[k,Math.round((v.score||0)*100)]));
          const metrics=Object.fromEntries(["first-contentful-paint","largest-contentful-paint","speed-index","total-blocking-time","cumulative-layout-shift","interactive"].map(k=>[k,j.audits[k]&&{score:j.audits[k].score,displayValue:j.audits[k].displayValue,numericValue:j.audits[k].numericValue}]));
          const failures=Object.entries(j.audits)
            .filter(([_,v])=>v.scoreDisplayMode!=="notApplicable"&&v.scoreDisplayMode!=="manual"&&v.score!==null&&v.score<1)
            .map(([id,v])=>({
              id,
              title:v.title,
              score:v.score,
              displayValue:v.displayValue,
              savingsMs:v.details?.overallSavingsMs,
              savingsBytes:v.details?.overallSavingsBytes,
              items:Array.isArray(v.details?.items)?v.details.items.slice(0,8):undefined
            }));
          console.log("LIGHTHOUSE_RESULT_START");
          console.log(JSON.stringify({categories,metrics,failures},null,2));
          console.log("LIGHTHOUSE_RESULT_END");
          NODE
