name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: constancia
          POSTGRES_PASSWORD: constancia
          POSTGRES_DB: constancia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://constancia:constancia@localhost:5432/constancia?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npx tsx scripts/smoke-pdf.ts
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

      - name: Wait for production deployment
        run: sleep 90
      - name: Lighthouse production audit
        run: |
          npx --yes lighthouse https://constancia-nu.vercel.app/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Print Lighthouse scores and failed audits
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('lighthouse.json','utf8'));
          const cats=r.categories;
          const scores=Object.fromEntries(Object.entries(cats).map(([k,v])=>[k,Math.round(v.score*100)]));
          console.log('LIGHTHOUSE_SCORES',JSON.stringify(scores));
          const failed=Object.values(r.audits)
            .filter(a=>a.score!==null && a.score<1 && ['binary','numeric'].includes(a.scoreDisplayMode))
            .map(a=>({id:a.id,title:a.title,score:a.score,displayValue:a.displayValue}));
          console.log('LIGHTHOUSE_FAILED_AUDITS',JSON.stringify(failed,null,2));
          NODE
